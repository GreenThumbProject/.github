name: Build and Push GreenThumb Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'greenthumb-core/**'
      - 'rasp5/fastapi/**'
      - 'rasp5/data_collection/**'
      - 'rasp5/db/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .                              # Root context for greenthumb-core access
          file: rasp5/fastapi/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/greenthumb-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-data-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Data Collection
        uses: docker/build-push-action@v5
        with:
          context: .                              # Root context for greenthumb-core access
          file: rasp5/data_collection/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/greenthumb-data-collection:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
